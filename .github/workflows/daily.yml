name: 每日A股复盘

on:
  # 定时任务：北京时间15:05（UTC 7:05），周一至周五
  schedule:
    - cron: '5 7 * * 1-5'
  # 允许手动触发测试
  workflow_dispatch:

jobs:
  run-stock-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 安装依赖库
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple --timeout=120

    - name: 运行复盘脚本
      env:
        TIANYI_API_KEY: ${{ secrets.TIANYI_API_KEY }}
        SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
      run: python stock_review.py

    - name: 失败告警
      if: failure()
      run: |
        curl "https://sctapi.ftqq.com/${{ secrets.SERVER_CHAN_KEY }}.send?title=复盘脚本运行失败&desp=请登录GitHub查看详细错误日志"
